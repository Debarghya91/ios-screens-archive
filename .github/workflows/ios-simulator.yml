name: iOS simulator build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: xcodebuild -project TrainingHub.xcodeproj -scheme TrainingHub -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
